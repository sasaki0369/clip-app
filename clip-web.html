<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Clip v2</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clip">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#fff;--surface:#f7f7f5;--surface2:#efefed;
    --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.13);
    --text:#111;--muted:#999;--muted2:#666;
    --green:#16a34a;--red:#dc2626;
    --r:10px;--f:'Geist',system-ui,sans-serif;--m:'Geist Mono',monospace;
  }
  html,body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.5;min-height:100dvh;-webkit-font-smoothing:antialiased}
  #app{max-width:680px;margin:0 auto;padding:0 16px;min-height:100dvh;display:flex;flex-direction:column}
  .header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;gap:12px}
  .logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--text);flex-shrink:0}
  .header-actions{display:flex;align-items:center;gap:8px}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;transition:background .3s;flex-shrink:0}
  .sync-dot.on{background:var(--green)}
  .sync-dot.busy{background:#f59e0b;animation:pulse 1s infinite}
  .sync-dot.err{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .icon-btn{width:32px;height:32px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--muted2);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
  .icon-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
  .tabs-wrap{display:flex;align-items:center;gap:2px;padding:12px 0 0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
  .tabs-wrap::-webkit-scrollbar{display:none}
  .tab-btn{flex-shrink:0;padding:5px 12px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
  .tab-btn:hover{color:var(--muted2);background:var(--surface)}
  .tab-btn.active{background:var(--text);color:#fff}
  .search-wrap{position:relative;margin:12px 0 0;flex-shrink:0}
  .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--f);font-size:13px;padding:9px 12px 9px 34px;outline:none;transition:border-color .15s}
  .search-input::placeholder{color:var(--muted)}
  .search-input:focus{border-color:var(--border2);background:#fff}
  #list{flex:1;padding:8px 0 120px;display:flex;flex-direction:column;gap:2px}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:8px;text-align:center}
  .empty-icon{margin-bottom:4px;opacity:.18}
  .empty-title{font-size:14px;font-weight:500;color:var(--muted2)}
  .empty-sub{font-size:13px;color:var(--muted)}
  .card{background:transparent;border-radius:var(--r);padding:11px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:start;gap:12px;border:1px solid transparent;transition:background .1s;animation:ci .16s ease both}
  @keyframes ci{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
  .card:hover{background:var(--surface);border-color:var(--border)}
  .card.selected{background:var(--surface);border-color:var(--border2)}
  .card-body{min-width:0}
  .card-text{font-size:13.5px;line-height:1.55;color:var(--text);word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
  .tab-badge{font-size:11px;font-family:var(--m);color:var(--muted2);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;cursor:pointer;transition:all .12s}
  .tab-badge:hover{color:var(--text);border-color:var(--border2)}
  .meta-date{font-size:11px;color:var(--muted);font-family:var(--m)}
  .meta-copies{font-size:11px;color:var(--muted);font-family:var(--m);margin-left:auto}
  .card-actions{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:1;transition:opacity .12s}
  .card:hover .card-actions,.card.selected .card-actions{opacity:1}
  @media(hover:none){.card-actions{opacity:1}}
  .sel-num{width:20px;height:20px;border-radius:50%;background:var(--text);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .del-btn{width:28px;height:28px;background:rgba(0,0,0,.04);border:1px solid var(--border);border-radius:7px;cursor:pointer;color:var(--muted2);display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
  .del-btn:hover{background:rgba(220,38,38,.1);color:var(--red);border-color:rgba(220,38,38,.25)}
  .del-btn:active{transform:scale(.92)}
  .edit-btn{width:28px;height:28px;background:rgba(0,0,0,.04);border:1px solid var(--border);border-radius:7px;cursor:pointer;color:var(--muted2);display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
  .edit-btn:hover{background:rgba(0,0,0,.07);color:var(--text);border-color:var(--border2)}
  .edit-btn:active{transform:scale(.92)}
  .select-bar{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--text);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:50;white-space:nowrap;animation:su .2s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes su{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .select-bar.hidden{display:none}
  .sel-label{font-size:13px;color:rgba(255,255,255,.6)}
  .bar-btn{padding:6px 12px;border-radius:8px;border:none;font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s}
  .bar-btn.merge{background:#fff;color:var(--text)}
  .bar-btn.cancel{background:rgba(255,255,255,.12);color:rgba(255,255,255,.7)}
  .input-area{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;padding:12px 16px 20px;background:linear-gradient(transparent,#fff 36%)}
  .input-box{display:flex;align-items:flex-end;gap:8px;background:#fff;border:1px solid var(--border2);border-radius:12px;padding:10px 10px 10px 14px;box-shadow:0 2px 16px rgba(0,0,0,.07),0 0 0 1px var(--border);transition:border-color .15s}
  .input-box:focus-within{border-color:rgba(0,0,0,.22);box-shadow:0 2px 20px rgba(0,0,0,.1)}
  .paste-area{flex:1;border:none;background:transparent;color:var(--text);font-family:var(--f);font-size:14px;resize:none;outline:none;line-height:1.5;min-height:22px;max-height:120px;overflow-y:auto}
  .paste-area::placeholder{color:var(--muted)}
  .clip-btn{width:32px;height:32px;flex-shrink:0;background:var(--surface);color:var(--muted2);border:1px solid var(--border);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .clip-btn:hover{background:var(--surface2);color:var(--text)}
  .clip-btn:active{transform:scale(.94)}
  .send-btn{width:32px;height:32px;flex-shrink:0;background:var(--text);color:#fff;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;opacity:.25}
  .send-btn.ready{opacity:1}
  .send-btn.ready:hover{opacity:.8;transform:scale(.96)}
  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap;z-index:200;opacity:0;transition:opacity .18s}
  #toast.show{opacity:1}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s ease}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:680px;max-height:85dvh;overflow-y:auto;animation:shu .22s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -4px 40px rgba(0,0,0,.1)}
  @media(min-width:600px){.ov{align-items:center;padding:20px}.modal{border-radius:16px;max-width:440px}}
  @keyframes shu{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
  .mhandle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 16px}
  .mtitle{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px;letter-spacing:-.02em}
  .msec{margin-bottom:20px}
  .mlabel{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:block}
  .minput{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--f);font-size:14px;padding:9px 12px;outline:none;transition:border-color .15s}
  .minput:focus{border-color:var(--border2);background:#fff}
  .mbtn{padding:7px 14px;border-radius:8px;font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap}
  .mbtn.p{background:var(--text);color:#fff;border:none}
  .mbtn.p:hover{opacity:.82}
  .mbtn.g{background:transparent;color:var(--muted2);border:1px solid var(--border)}
  .mbtn.g:hover{color:var(--text);border-color:var(--border2)}
  .mbtn.g:active{background:var(--surface2)}
  .tab-pick-btn{width:100%;text-align:left;margin-bottom:8px;font-family:var(--m);
    padding:13px 16px !important;font-size:15px !important;border-radius:10px !important;
    background:var(--surface) !important;border:1px solid var(--border) !important;
    color:var(--text) !important;display:flex;align-items:center;gap:10px}
  .tab-pick-btn:hover{background:var(--surface2) !important;border-color:var(--border2) !important}
  .tab-pick-btn:active{background:var(--text) !important;color:#fff !important}
  .mbtn.d{background:transparent;color:var(--red);border:1px solid rgba(220,38,38,.2)}
  .mbtn.d:hover{background:rgba(220,38,38,.05)}
  .mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .trow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--border)}
  .trow:last-child{border-bottom:none}
  .tname{flex:1;font-size:14px;color:var(--text);font-family:var(--m)}
  .mini{width:26px;height:26px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--muted2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
  .mini:hover{color:var(--text);border-color:var(--border2)}
  .mini:disabled{opacity:.25;cursor:default}
  .mini.d:hover{color:var(--red);border-color:rgba(220,38,38,.25)}
  .cov{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .12s ease}
  .cbox{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;max-width:320px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.12);animation:shu .18s cubic-bezier(.34,1.2,.64,1)}
  .ctitle{font-size:15px;font-weight:600;margin-bottom:6px}
  .cmsg{font-size:13px;color:var(--muted2);margin-bottom:18px;line-height:1.6}
  .cbtns{display:flex;gap:8px;justify-content:flex-end}
  .ibox{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--muted2);line-height:1.7}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<!-- ログイン画面 -->
<div id="login-screen" style="display:none;position:fixed;inset:0;background:#fff;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:1000">
  <div style="display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;color:#111">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <rect x="8" y="2" width="8" height="4" rx="1.5"/>
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
      <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/>
    </svg>
    Clip
  </div>
  <p style="color:#999;font-size:14px">クリップボード管理アプリ</p>
  <button onclick="signInWithGoogle()" style="display:flex;align-items:center;gap:10px;padding:12px 24px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:15px;font-weight:500;cursor:pointer;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.08)">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Googleでログイン
  </button>
</div>

<!-- Firebase CDN（モジュールなし・compat版） -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<div id="app" style="display:none">
  <header class="header">
    <div class="logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="2" width="8" height="4" rx="1.5"/>
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/>
      </svg>
      Clip
    </div>
    <div class="header-actions">
      <div class="sync-dot" id="sync-dot"></div>
      <button class="icon-btn" id="sort-btn" onclick="showSortMenu()" title="並べ替え">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="showSettings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="tabs-wrap" id="tabs-row"></div>
  <div class="search-wrap">
    <span class="si">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </span>
    <input class="search-input" id="search" placeholder="検索…" oninput="renderList()">
  </div>
  <div id="list"></div>
  <div class="select-bar hidden" id="select-bar">
    <span class="sel-label" id="sel-label"></span>
    <button class="bar-btn merge" onclick="mergeSelected()">統合コピー</button>
    <button class="bar-btn cancel" onclick="clearSelect()">キャンセル</button>
  </div>
  <div class="input-area">
    <div class="input-box">
      <textarea class="paste-area" id="paste-area" placeholder="ここに貼り付け… (Ctrl+V / ⌘V)" rows="1"
        oninput="onTA(this)" onkeydown="onTAKey(event)"></textarea>
      <button class="clip-btn" onclick="pasteFromClipboard()" title="クリップボードから取得">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="2" width="8" height="4" rx="1.5"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/>
        </svg>
      </button>
      <button class="send-btn" id="send-btn" onclick="submitPaste()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// ── Firebase compat初期化 ─────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey: "AIzaSyAxVn7JUuoBsNeSODksNYyEkd2W2E252_c",
  authDomain: "life--log.firebaseapp.com",
  databaseURL: "https://life--log-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "life--log",
  storageBucket: "life--log.firebasestorage.app",
  messagingSenderId: "790653257684",
  appId: "1:790653257684:web:dd84bf5e0a38db328f3841"
});
const fdb = firebase.database();
const fauth = firebase.auth();

// ── Google認証 ────────────────────────────────────────────────────────────────
let authReady = false;
const pendingAfterAuth = [];

fauth.onAuthStateChanged(function(user) {
  if (user) {
    // ログイン済み → 認証完了
    authReady = true;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    setSyncStatus('busy');
    pendingAfterAuth.forEach(function(fn) { fn(); });
    pendingAfterAuth.length = 0;
  } else {
    // 未ログイン → ログイン画面を表示
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  fauth.signInWithRedirect(provider);
}

// リダイレクト後の結果を処理
fauth.getRedirectResult().catch(function(err) {
  console.error('認証エラー:', err);
  toast('ログインに失敗しました: ' + err.message);
});

function whenAuthReady(fn) {
  if (authReady) fn();
  else pendingAfterAuth.push(fn);
}

// ── State ─────────────────────────────────────────────────────────────────────
const SKEY = 'clip_settings_v4';
let items    = [];
let settings = { retentionDays: 30, tabs: ['仕事','メモ','URL','コード'] };
let activeTabs = ['すべて']; // 複数選択対応
let sortOrder = localStorage.getItem('clip_sort_order') || 'copies'; // 永続化
let selected  = []; // textの配列
let longTimer = null;
let pendingText = null;
const deletedKeys = new Set();
let ignoreSettingsUpdate = false;

function loadSettings() {
  try { settings = {...settings, ...JSON.parse(localStorage.getItem(SKEY)||'{}')}; } catch(e){}
}
function saveSettings() {
  localStorage.setItem(SKEY, JSON.stringify(settings));
}

// ── Utils ─────────────────────────────────────────────────────────────────────
const now   = () => Date.now();
const esc   = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const trunc = (t, n=200) => t.length > n ? t.slice(0,n)+'…' : t;

function fmtDate(ms) {
  const now2  = new Date();
  const target = new Date(ms);
  const time = target.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  const date = target.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
  // 日付を日本時間でYYYY-MM-DD形式で比較
  const toDay = d => d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'});
  const todayStr    = toDay(now2);
  const targetStr   = toDay(target);
  const yesterdayStr = toDay(new Date(now2.getTime() - 86400000));
  const diffDays = Math.floor((now2 - target) / 86400000);
  if (targetStr === todayStr)      return date + ' ' + time;
  if (targetStr === yesterdayStr)  return '昨日 ' + time;
  if (diffDays < 7)                return diffDays + '日前 ' + time;
  return target.toLocaleDateString('ja-JP',{month:'short',day:'numeric'});
}

// SHA-256ハッシュ→32文字キー（Promiseを返す）
function textToKey(text) {
  const enc = new TextEncoder();
  return crypto.subtle.digest('SHA-256', enc.encode(text)).then(buf => {
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
  });
}

// ── Firebase初期化（認証完了後、削除済みキーを先に読んでからclipsを監視） ─────
whenAuthReady(function() {
fdb.ref('clipApp/deleted').once('value', function(delSnap) {
  const delData = delSnap.val() || {};
  Object.keys(delData).forEach(k => deletedKeys.add(k));

  // clips監視開始
  fdb.ref('clipApp/clips').on('value', function(snap) {
    const cut = now() - settings.retentionDays * 86400000;
    const next = [];
    snap.forEach(function(child) {
      if (deletedKeys.has(child.key)) return;
      const r = child.val();
      if (!r || !r.text || !r.lastUsed || r.lastUsed < cut) return;
      // memoフィールドがなければ空文字で補完
      // 必須フィールドの補完（Firebaseに存在しない場合のデフォルト値）
      if (r.memo === undefined || r.memo === null) r.memo = '';
      if (!Array.isArray(r.tabs) || r.tabs.length === 0) {
        r.tabs = r.tab ? [r.tab] : ['未分類'];
      }
      if (!r.tab) r.tab = r.tabs[0];
      if (!r.createdAt) r.createdAt = r.lastUsed;
      next.push(r); // Firebaseを常にsource of truth
    });
    items = next;
    setSyncStatus('on');
    renderList();
  }, function(err) {
    setSyncStatus('err');
    toast('接続エラー: ' + err.message);
  });
});

// 設定監視
fdb.ref('clipApp/app_settings').on('value', function(snap) {
  if (ignoreSettingsUpdate) return;
  const data = snap.val();
  if (!data) return;
  const remoteTabs = Array.isArray(data.tabs) ? data.tabs : [];
  const remoteDays = Number(data.retentionDays) || 30;
  if (remoteTabs.length > 0 && JSON.stringify(remoteTabs) !== JSON.stringify(settings.tabs)) {
    settings.tabs = remoteTabs;
    saveSettings(); renderTabs();
  }
  if (remoteDays !== settings.retentionDays) {
    settings.retentionDays = remoteDays;
    saveSettings();
  }
});

function pushSettings() {
  ignoreSettingsUpdate = true;
  fdb.ref('clipApp/app_settings').set({ tabs: settings.tabs, retentionDays: settings.retentionDays });
  setTimeout(function() { ignoreSettingsUpdate = false; }, 3000);
}
}); // whenAuthReady終了

// ── Add ───────────────────────────────────────────────────────────────────────
function addItem(text, tab) {
  const t = text.trim();
  if (!t) return;
  const ex = items.find(i => i.text === t);
  if (ex) {
    const exCopies = (ex.copies || 0) + 1;
    const exLastUsed = now();
    ex.copies = exCopies; ex.lastUsed = exLastUsed;
    renderList();
    textToKey(t).then(function(key) {
      fdb.ref('clipApp/clips/'+key).update({ copies: exCopies, lastUsed: exLastUsed });
    });
  } else {
    const initTab = tab || settings.tabs[0] || '未分類';
    const item = { text: t, tab: initTab, tabs: [initTab], copies: 1, createdAt: now(), lastUsed: now(), memo: '' };
    items.unshift(item); renderList();
    textToKey(t).then(function(key) {
      // 削除済みリストから除去してから保存（再追加を許可）
      deletedKeys.delete(key);
      fdb.ref('clipApp/deleted/'+key).remove();
      fdb.ref('clipApp/clips/'+key).set(item);
    });
  }
  toast('追加しました');
}

function pickTabAndSave(text) {
  pendingText = text;
  const btns = settings.tabs.map(function(t) {
    const tb64 = btoa(unescape(encodeURIComponent(t)));
    return '<button class="mbtn tab-pick-btn" onclick="confirmTabB64(&quot;'+tb64+'&quot;)">'+esc(t)+'</button>';
  }).join('');
  showSheet('タブを選択して保存', btns);
}
function confirmTabB64(tb64) {
  closeModal();
  const tab = decodeURIComponent(escape(atob(tb64)));
  if (pendingText) { addItem(pendingText, tab); pendingText = null; }
}

// ── URL判定 ───────────────────────────────────────────────────────────────────
function isUrl(text) {
  return /^https?:\/\//i.test(text.trim());
}

// ── Copy ──────────────────────────────────────────────────────────────────────
function copyItemByText(text) {
  const item = items.find(i => i.text === text);
  if (!item) return;
  // コピー実行
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(item.text).catch(function() { fallbackCopy(item.text); });
  } else {
    fallbackCopy(item.text);
  }
  // 値をキャプチャ（.then()内でitemが差し替わっても正しい値を送れるよう）
  const newCopies = (item.copies || 0) + 1;
  const newLastUsed = now();
  // ローカル即時更新
  item.copies = newCopies; item.lastUsed = newLastUsed;
  renderList(); toast('コピーしました ✓');
  // Firebase更新（キャプチャした値を使う）
  textToKey(text).then(function(key) {
    fdb.ref('clipApp/clips/'+key).update({ copies: newCopies, lastUsed: newLastUsed });
  });
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

async function saveEdit(b64orig) {
  const origText = decodeURIComponent(escape(atob(b64orig)));
  const el = document.getElementById('edit-textarea');
  if (!el) return;
  const newText = el.value.trim();
  if (!newText) { toast('テキストが空です'); return; }

  // 選択中の全タブを取得（複数選択対応）
  const activeTabBtns = document.querySelectorAll('#edit-tab-btns [data-action="etab"].p');
  let newTabs = Array.prototype.map.call(activeTabBtns, function(btn) {
    return decodeURIComponent(escape(atob(btn.dataset.tab)));
  });
  if (newTabs.length === 0) newTabs = [settings.tabs[0] || '未分類'];

  const item = items.find(function(i) { return i.text === origText; });
  if (!item) { closeModal(); return; }

  // DOMから値を取得（closeModal()の前に必ず取得する）
  const memoEl = document.getElementById('edit-memo');
  const newMemo = memoEl ? memoEl.value : '';

  // 変更チェック
  const currentMemo = (item.memo == null || item.memo === undefined) ? '' : String(item.memo);
  const currentTabs = Array.isArray(item.tabs) && item.tabs.length > 0 ? item.tabs : [item.tab];
  const tabsChanged = newTabs.length !== currentTabs.length ||
    !newTabs.every(function(t) { return currentTabs.includes(t); });

  closeModal();

  if (newText === origText && !tabsChanged && newMemo.trim() === currentMemo) {
    toast('変更なし'); return;
  }

  const newTab = newTabs[0]; // 後方互換：先頭タブをtabフィールドにも保持

  if (newText !== origText) {
    // テキストが変わった場合：旧キーを削除して新キーで保存
    textToKey(origText).then(function(oldKey) {
      deletedKeys.add(oldKey);
      fdb.ref('deleted/'+oldKey).set(now());
      fdb.ref('clips/'+oldKey).remove();
    });
    // ローカル更新
    item.text = newText; item.tab = newTab; item.tabs = newTabs; item.memo = newMemo; item.lastUsed = now();
    // 新キーで保存
    textToKey(newText).then(function(newKey) {
      deletedKeys.delete(newKey);
      fdb.ref('deleted/'+newKey).remove();
      fdb.ref('clips/'+newKey).set({
        text: newText, tab: newTab, tabs: newTabs, memo: newMemo,
        copies: item.copies, createdAt: item.createdAt, lastUsed: item.lastUsed
      });
    });
  } else {
    // タブ・メモのみ変更
    const updates = {};
    if (tabsChanged) { item.tab = newTab; item.tabs = newTabs; updates.tab = newTab; updates.tabs = newTabs; }
    const curMemo = (item.memo == null || item.memo === undefined) ? '' : String(item.memo);
    const trimmedNewMemo = newMemo.trim();
    if (trimmedNewMemo !== curMemo) { item.memo = trimmedNewMemo; updates.memo = trimmedNewMemo; }
    if (Object.keys(updates).length > 0) {
      textToKey(origText).then(function(key) {
        fdb.ref('clipApp/clips/'+key).update(updates);
      });
    } else {
      toast('変更なし'); return;
    }
  }

  renderList(); toast('保存しました');
}

// HTML属性に安全に埋め込むためのエスケープ
function escForAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Delete ────────────────────────────────────────────────────────────────────
function deleteItemByText(text) {
  const item = items.find(i => i.text === text);
  if (!item) return;
  const preview = text.slice(0,40) + (text.length>40?'...':'');
  confirm2('削除の確認', '"'+preview+'" を削除しますか？', function() {
    items = items.filter(i => i.text !== text);
    selected = selected.filter(s => s !== text);
    updateSelectBar(); renderList(); toast('削除しました');
    textToKey(text).then(function(key) {
      deletedKeys.add(key);
      fdb.ref('clipApp/deleted/'+key).set(now());
      fdb.ref('clipApp/clips/'+key).remove();
    });
  });
}

// ── Tab Change ────────────────────────────────────────────────────────────────
function changeTabByText(text) {
  const item = items.find(i => i.text === text);
  if (!item) return;
  const b64text = btoa(unescape(encodeURIComponent(text)));
  const btns = settings.tabs.map(function(t) {
    const tb64 = btoa(unescape(encodeURIComponent(t)));
    return '<button class="mbtn tab-pick-btn" onclick="applyTabChange(&quot;'+b64text+'&quot;,&quot;'+tb64+'&quot;)">'+esc(t)+'</button>';
  }).join('');
  showSheet('タブを変更', btns);
}
function applyTabChange(b64text, tb64) {
  closeModal();
  const text = decodeURIComponent(escape(atob(b64text)));
  const tab  = decodeURIComponent(escape(atob(tb64)));
  const item = items.find(i => i.text === text);
  if (!item) return;
  // タブバッジからのクリックは単一タブとして設定（既存のtabs配列を置き換え）
  item.tab = tab; item.tabs = [tab]; renderList(); toast('「'+tab+'」に移動しました');
  textToKey(text).then(function(key) { fdb.ref('clipApp/clips/'+key).update({ tab: tab, tabs: [tab] }); });
}

// ── Select ────────────────────────────────────────────────────────────────────
function toggleSelectByText(text) {
  if (selected.includes(text)) selected = selected.filter(s => s !== text);
  else selected.push(text);
  updateSelectBar(); renderList();
}
function clearSelect() { selected = []; updateSelectBar(); renderList(); }
function updateSelectBar() {
  const bar = document.getElementById('select-bar');
  const lbl = document.getElementById('sel-label');
  if (!bar) return;
  if (selected.length === 0) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  if (lbl) lbl.textContent = selected.length + '件選択中';
}
function mergeSelected() {
  const merged = selected.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(merged).catch(function() { fallbackCopy(merged); });
  } else { fallbackCopy(merged); }
  // 選択した各アイテムのカウントアップ
  selected.forEach(function(text) {
    const item = items.find(function(i) { return i.text === text; });
    if (!item) return;
    const newCopies = (item.copies || 0) + 1;
    const newLastUsed = now();
    item.copies = newCopies; item.lastUsed = newLastUsed;
    textToKey(text).then(function(key) {
      fdb.ref('clipApp/clips/'+key).update({ copies: newCopies, lastUsed: newLastUsed });
    });
  });
  renderList();
  toast(selected.length + '件を統合してコピー ✓'); clearSelect();
}

// ── Clipboard ─────────────────────────────────────────────────────────────────
function pasteFromClipboard() {
  if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText().then(function(text) {
      if (!text.trim()) { toast('クリップボードが空です'); return; }
      const el = document.getElementById('paste-area');
      if (el) { el.value = text; onTA(el); el.focus(); }
      toast('取得しました');
    }).catch(function() {
      const el = document.getElementById('paste-area');
      if (el) el.focus();
      toast('入力欄を長押し→貼り付け');
    });
  } else {
    const el = document.getElementById('paste-area');
    if (el) el.focus();
    toast('入力欄を長押し→貼り付け');
  }
}

// ── Textarea ──────────────────────────────────────────────────────────────────
function onTA(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  const btn = document.getElementById('send-btn');
  if (!btn) return;
  btn.disabled = !el.value.trim();
  btn.classList.toggle('ready', !!el.value.trim());
}
function onTAKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitPaste(); }
}
function submitPaste() {
  const el = document.getElementById('paste-area');
  if (!el) return;
  const text = el.value.trim();
  if (!text) return;
  el.value = ''; onTA(el);
  if (settings.tabs.length <= 1) { addItem(text, settings.tabs[0] || '未分類'); return; }
  pickTabAndSave(text);
}

// ── Render Tabs ───────────────────────────────────────────────────────────────
function renderTabs() {
  const row = document.getElementById('tabs-row');
  if (!row) return;
  row.innerHTML = ['すべて'].concat(settings.tabs).map(function(t) {
    const isActive = activeTabs.includes(t);
    return '<button class="tab-btn '+(isActive?'active':'')+'" onclick="switchTab(&quot;'+esc(t)+'&quot;)">'+esc(t)+'</button>';
  }).join('');
}
function switchTab(t) {
  // 上部タブは単一選択のみ
  activeTabs = [t];
  renderTabs(); renderList();
}

// ── Render List ───────────────────────────────────────────────────────────────
function renderList() {
  const q = (document.getElementById('search') || {value:''}).value.toLowerCase();
  const display = items
    .filter(function(i) {
      if (activeTabs.includes('すべて')) return true;
      const itemTabs = Array.isArray(i.tabs) ? i.tabs : [i.tab];
      return itemTabs.some(function(t) { return activeTabs.includes(t); });
    })
    .filter(function(i) { return !q || i.text.toLowerCase().includes(q); })
    .sort(function(a,b) {
      if (sortOrder === 'copies')    return b.copies - a.copies || b.lastUsed - a.lastUsed;
      if (sortOrder === 'createdAt') return b.createdAt - a.createdAt;
      if (sortOrder === 'lastUsed')  return b.lastUsed - a.lastUsed;
      return 0;
    });

  const list = document.getElementById('list');
  if (!list) return;

  if (display.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="8" y="2" width="8" height="4" rx="1.5"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg></div><p class="empty-title">クリップはありません</p><p class="empty-sub">📋ボタンまたは入力欄にテキストを貼り付けて追加</p></div>';
    return;
  }

  list.innerHTML = display.map(function(item, idx) {
    const isSel = selected.includes(item.text);
    const si    = selected.indexOf(item.text);
    const b64   = btoa(unescape(encodeURIComponent(item.text)));
    return '<div class="card '+(isSel?'selected':'')+'" data-idx="'+idx+'" data-b64="'+b64+'">'
      + '<div class="card-body">'
      + '<div class="card-text">'+esc(trunc(item.text))+'</div>'
      + '<div class="card-meta">'
      + (Array.isArray(item.tabs) && item.tabs.length > 0 ? item.tabs : [item.tab]).map(function(t) {
          return '<span class="tab-badge" data-action="tab">'+esc(t)+'</span>';
        }).join('')
      + '<span class="meta-date">登録 '+fmtDate(item.createdAt||item.lastUsed)+'</span>'
      + '<span class="meta-date" style="color:var(--muted)">最終 '+fmtDate(item.lastUsed)+'</span>'
      + '<span class="meta-copies">×'+item.copies+'</span>'
      + '</div>'
      + (item.memo ? '<div class="card-memo">'+esc(item.memo)+'</div>' : '')
      + '</div>'
      + '<div class="card-actions">'
      + (isSel
        ? '<div class="sel-num">'+(si+1)+'</div>'
        : '<button class="edit-btn" data-action="edit"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
        + '<button class="del-btn" data-action="del"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>')
      + '</div></div>';
  }).join('');

  // イベントをdata-b64で一元管理（onclick属性を使わない）
  list.querySelectorAll('.card').forEach(function(card) {
    const b64  = card.dataset.b64;
    const text = decodeURIComponent(escape(atob(b64)));

    card.addEventListener('pointerdown', function() {
      longTimer = setTimeout(function() { toggleSelectByText(text); }, 500);
    });
    card.addEventListener('pointerup',    function() { clearTimeout(longTimer); });
    card.addEventListener('pointerleave', function() { clearTimeout(longTimer); });

    card.addEventListener('click', function(e) {
      if (e.target.closest('[data-action="del"]')) {
        e.stopPropagation(); deleteItemByText(text); return;
      }
      if (e.target.closest('[data-action="edit"]')) {
        e.stopPropagation(); editItemByText(text); return;
      }
      if (e.target.closest('[data-action="tab"]')) {
        e.stopPropagation(); changeTabByText(text); return;
      }
      if (selected.length > 0) toggleSelectByText(text);
      else if (isUrl(text)) showUrlActionSheet(text);
      else copyItemByText(text);
    });
  });
}

// ── Toast ─────────────────────────────────────────────────────────────────────
var toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function showSheet(title, bodyHtml) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'modal-ov';
  ov.innerHTML = '<div class="modal"><div class="mhandle"></div><p class="mtitle">'+title+'</p><div>'+bodyHtml+'</div><div class="mfoot"><button class="mbtn g" onclick="closeModal()">キャンセル</button></div></div>';
  ov.addEventListener('click', function(e) { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() { var el = document.getElementById('modal-ov'); if (el) el.remove(); }

function confirm2(title, msg, onOk) {
  closeConfirm();
  const ov = document.createElement('div');
  ov.className = 'cov'; ov.id = 'confirm-ov';
  ov.innerHTML = '<div class="cbox"><p class="ctitle">'+title+'</p><p class="cmsg">'+esc(msg)+'</p><div class="cbtns"><button class="mbtn g" onclick="closeConfirm()">キャンセル</button><button class="mbtn d" id="cok">削除</button></div></div>';
  ov.querySelector('#cok').addEventListener('click', function() { closeConfirm(); onOk(); });
  document.body.appendChild(ov);
}
function closeConfirm() { var el = document.getElementById('confirm-ov'); if (el) el.remove(); }

// ── 並べ替え ─────────────────────────────────────────────────────────────────
function showSortMenu() {
  const opts = [
    { key: 'copies',    label: 'コピー回数順（多い順）' },
    { key: 'createdAt', label: '登録日順（新しい順）' },
    { key: 'lastUsed',  label: '最新コピー日順（新しい順）' },
  ];
  const html2 = opts.map(function(o) {
    const active = sortOrder === o.key;
    return '<button class="mbtn '+(active?'p':'g')+'" style="width:100%;text-align:left;margin-bottom:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:14px" onclick="setSortOrder(&quot;'+o.key+'&quot;)">'
      + (active ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>' : '<span style="width:14px;display:inline-block"></span>')
      + esc(o.label) + '</button>';
  }).join('');
  showSheet('並べ替え', html2);
}
function setSortOrder(key) {
  sortOrder = key;
  localStorage.setItem('clip_sort_order', key); // 永続化
  closeModal();
  renderList();
  const btn = document.getElementById('sort-btn');
  if (btn) btn.style.color = (sortOrder !== 'copies') ? 'var(--text)' : '';
}

// ── Settings ──────────────────────────────────────────────────────────────────
function showSettings() {
  const tabs = settings.tabs;
  const tlist = tabs.map(function(t, i) {
    return '<div class="trow"><span class="tname">'+esc(t)+'</span>'
      + '<button class="mini" '+(i===0?'disabled':'')+' onclick="moveTab('+i+',-1)">↑</button>'
      + '<button class="mini" '+(i===tabs.length-1?'disabled':'')+' onclick="moveTab('+i+',1)">↓</button>'
      + '<button class="mini d" onclick="removeTab('+i+')">'
      + '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>'
      + '</button></div>';
  }).join('');

  const html = '<div class="msec"><span class="mlabel">自動消去</span>'
    + '<div style="display:flex;align-items:center;gap:10px">'
    + '<input class="minput" type="number" id="ret-days" min="1" max="365" value="'+settings.retentionDays+'" style="width:80px;text-align:center">'
    + '<span style="color:var(--muted);font-size:13px">日間未使用で削除</span></div></div>'
    + '<div class="msec"><span class="mlabel">タブ管理</span>'
    + '<div id="tab-list">'+tlist+'</div>'
    + '<div style="display:flex;gap:8px;margin-top:10px">'
    + '<input class="minput" id="new-tab" placeholder="新しいタブ名…" style="flex:1" onkeydown=&quot;if(event.key===&apos;Enter&apos;)addTab()&quot;>'
    + '<button class="mbtn p" onclick="addTab()">追加</button></div></div>'
    + '<div class="msec"><span class="mlabel">データ</span>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="mbtn g" onclick="exportCSV()">CSVエクスポート</button>'
    + '<button class="mbtn g" onclick="importCSV()">CSVインポート</button>'
    + '<button class="mbtn d" onclick="clearAll()">すべて削除</button>'
    + '</div></div>'
    + '<div class="mfoot"><button class="mbtn g" onclick="closeModal()">閉じる</button>'
    + '<button class="mbtn p" onclick="saveS()">保存</button></div>';

  closeModal();
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'modal-ov';
  ov.innerHTML = '<div class="modal"><div class="mhandle"></div><p class="mtitle">設定</p>'+html+'</div>';
  ov.addEventListener('click', function(e) { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}

function saveS() {
  const d = parseInt((document.getElementById('ret-days')||{}).value, 10);
  if (!isNaN(d)) settings.retentionDays = Math.max(1, d);
  saveSettings(); pushSettings(); closeModal(); toast('設定を保存しました'); renderTabs();
}
function moveTab(i, dir) {
  const t = settings.tabs, ni = i + dir;
  if (ni < 0 || ni >= t.length) return;
  var tmp = t[i]; t[i] = t[ni]; t[ni] = tmp;
  saveSettings(); pushSettings(); showSettings();
}
function removeTab(i) {
  const name = settings.tabs[i];
  settings.tabs.splice(i, 1);
  if (activeTab === name) activeTab = 'すべて';
  saveSettings(); pushSettings(); showSettings(); renderTabs(); renderList();
}
function addTab() {
  const el = document.getElementById('new-tab');
  const name = el ? el.value.trim() : '';
  if (!name || settings.tabs.includes(name)) return;
  settings.tabs.push(name);
  saveSettings(); pushSettings(); showSettings(); renderTabs();
}
function clearAll() {
  confirm2('すべて削除', 'すべてのクリップを削除します。この操作は元に戻せません。', function() {
    const texts = items.map(function(i) { return i.text; });
    items = []; selected = []; updateSelectBar(); renderList(); closeModal(); toast('削除しました');
    texts.forEach(function(t) {
      textToKey(t).then(function(key) {
        deletedKeys.add(key);
        fdb.ref('clipApp/deleted/'+key).set(now());
        fdb.ref('clipApp/clips/'+key).remove();
      });
    });
  });
}

// ── Export/Import ─────────────────────────────────────────────────────────────
function exportCSV() {
  let csv = '\uFEFFtext,tab,copies,created_at,last_used\n';
  items.forEach(function(i) {
    csv += '"'+i.text.replace(/"/g,'""')+'","'+i.tab+'",'+i.copies+','+(i.createdAt||now())+','+i.lastUsed+'\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'clip_backup_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); toast('エクスポートしました');
}
function importCSV() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv,text/csv';
  input.onchange = function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      let raw = ev.target.result;
      if (raw.startsWith('﻿')) raw = raw.slice(1);
      const records = parseCSVAll(raw);
      const rows = (records[0] && records[0][0]==='text') ? records.slice(1) : records;
      let added=0, skipped=0;
      rows.forEach(function(r) {
        const text = (r[0]||'').trim(); if (!text) return;
        const tab  = (r[1]||'').trim() || settings.tabs[0] || '未分類';
        const copies    = parseInt(r[2])||1;
        const createdAt = parseInt(r[3])||now();
        const lastUsed  = parseInt(r[4])||now();
        if (!items.find(function(i) { return i.text===text; })) {
          textToKey(text).then(function(key) {
            deletedKeys.delete(key);
            fdb.ref('clipApp/deleted/'+key).remove();
            fdb.ref('clipApp/clips/'+key).set({text:text,tab:tab,tabs:[tab],copies:copies,createdAt:createdAt,lastUsed:lastUsed});
          });
          items.push({text:text,tab:tab,tabs:[tab],copies:copies,createdAt:createdAt,lastUsed:lastUsed});
          added++;
        } else skipped++;
      });
      if (added > 0) renderList();
      toast(added+'件追加、'+skipped+'件スキップ');
    };
    reader.readAsText(file, 'UTF-8');
  };
  input.click();
}
function parseCSVAll(raw) {
  const records=[], rec=[], field=[];
  let inQ=false, i=0;
  function push() { rec.push(field.splice(0).join('')); }
  while (i < raw.length) {
    const c = raw[i];
    if (c==='"'&&!inQ) inQ=true;
    else if (c==='"'&&inQ&&raw[i+1]==='"') { field.push('"'); i++; }
    else if (c==='"'&&inQ) inQ=false;
    else if (c===','&&!inQ) push();
    else if (c==='\n'&&!inQ) { push(); records.push(rec.slice()); rec.length=0; }
    else if (c==='\n'&&!inQ) {}
    else field.push(c);
    i++;
  }
  push(); if (rec.length) records.push(rec.slice());
  return records.filter(function(r) { return r.some(function(f){return f.trim();}); });
}

// ── スワイプでタブ切り替え ────────────────────────────────────────────────────
(function() {
  var sx = 0, sy = 0, sTarget = null, sTracking = false;

  function getAllTabs() { return ['すべて'].concat(settings.tabs); }

  function swipeToTab(dir) {
    var tabs = getAllTabs();
    var idx = tabs.indexOf(activeTabs.includes('すべて') ? 'すべて' : activeTabs[activeTabs.length-1]);
    var next = idx + dir;
    if (next < 0 || next >= tabs.length) return;
    switchTab(tabs[next]);
    var tabRow = document.getElementById('tabs-row');
    if (tabRow) {
      var btn = tabRow.querySelectorAll('.tab-btn')[next];
      if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }

  // タッチ開始：#app全体で受け取る
  document.addEventListener('touchstart', function(e) {
    if (document.getElementById('modal-ov') || document.getElementById('confirm-ov')) {
      sTracking = false; return;
    }
    var tag = e.target ? e.target.tagName : '';
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'BUTTON') {
      sTracking = false; return;
    }
    var t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    sTarget = e.target;
    sTracking = true;
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (!sTracking) return;
    sTracking = false;
    if (document.getElementById('modal-ov') || document.getElementById('confirm-ov')) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx;
    var dy = t.clientY - sy;
    // 横>縦 かつ 50px以上
    if (Math.abs(dx) < 50) return;
    if (Math.abs(dy) > Math.abs(dx) * 0.8) return;
    // スワイプ成立 → longTimerをキャンセルしてタブ切り替え
    clearTimeout(longTimer);
    if (dx < 0) swipeToTab(1);
    else        swipeToTab(-1);
  }, { passive: true });

  // PCマウスドラッグ
  var mx = 0, my = 0, mDrag = false;
  document.addEventListener('mousedown', function(e) {
    var tag = e.target ? e.target.tagName : '';
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'BUTTON') return;
    if (document.getElementById('modal-ov')) return;
    mx = e.clientX; my = e.clientY; mDrag = true;
  });
  document.addEventListener('mouseup', function(e) {
    if (!mDrag) return; mDrag = false;
    if (document.getElementById('modal-ov')) return;
    var dx = e.clientX - mx;
    var dy = e.clientY - my;
    if (Math.abs(dx) < 80 || Math.abs(dy) > Math.abs(dx) * 0.8) return;
    if (dx < 0) swipeToTab(1);
    else        swipeToTab(-1);
  });
})();

// ── Init ─────────────────────────────────────────────────────────────────────
loadSettings();
renderTabs();
renderList();
setSyncStatus('busy');
// 起動時にソートボタンの色を復元
(function() {
  const btn = document.getElementById('sort-btn');
  if (btn && sortOrder !== 'copies') btn.style.color = 'var(--text)';
})();
</script>

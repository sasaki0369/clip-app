<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Clip</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clip">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #ffffff;
    --surface:  #f7f7f5;
    --surface2: #efefed;
    --border:   rgba(0,0,0,0.07);
    --border2:  rgba(0,0,0,0.13);
    --text:     #111111;
    --muted:    #999;
    --muted2:   #666;
    --accent:   #111111;
    --green:    #16a34a;
    --red:      #dc2626;
    --radius:   10px;
    --font:     'Geist', system-ui, sans-serif;
    --mono:     'Geist Mono', monospace;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    gap: 12px;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600;
    letter-spacing: -0.02em; color: var(--text);
    flex-shrink: 0;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 32px; height: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer;
    color: var(--muted2);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }

  /* ── Tabs */
  .tabs-wrap {
    display: flex; align-items: center; gap: 2px;
    padding: 12px 0 0;
    overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0; padding: 5px 12px; border-radius: 6px;
    border: none; background: transparent; color: var(--muted);
    font-family: var(--font); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--muted2); background: var(--surface); }
  .tab-btn.active { background: var(--text); color: #fff; }

  /* ── Search */
  .search-wrap { position: relative; margin: 12px 0 0; flex-shrink: 0; }
  .search-icon {
    position: absolute; left: 11px; top: 50%;
    transform: translateY(-50%); color: var(--muted); pointer-events: none;
  }
  .search-input {
    width: 100%; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: var(--font); font-size: 13px;
    padding: 9px 12px 9px 34px; outline: none; transition: border-color 0.15s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--border2); background: #fff; }

  /* ── List */
  #list { flex: 1; padding: 8px 0 120px; display: flex; flex-direction: column; gap: 2px; }
  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 20px; gap: 8px; text-align: center;
  }
  .empty-icon { margin-bottom: 4px; opacity: 0.18; }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--muted2); }
  .empty-sub { font-size: 13px; color: var(--muted); }

  /* ── Card */
  .card {
    background: transparent; border-radius: var(--radius);
    padding: 11px 14px; cursor: pointer; position: relative;
    transition: background 0.1s;
    display: grid; grid-template-columns: 1fr auto;
    align-items: start; gap: 12px;
    border: 1px solid transparent;
    animation: cardIn 0.16s ease both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(3px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:hover { background: var(--surface); border-color: var(--border); }
  .card.selected { background: var(--surface); border-color: var(--border2); }
  .card-body { min-width: 0; }
  .card-text {
    font-size: 13.5px; line-height: 1.55; color: var(--text);
    word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .tab-badge {
    font-size: 11px; font-family: var(--mono); color: var(--muted2);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 6px; cursor: pointer; transition: all 0.12s;
  }
  .tab-badge:hover { color: var(--text); border-color: var(--border2); }
  .meta-date { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .meta-copies { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-left: auto; }
  .card-actions { display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity 0.12s; }
  .card:hover .card-actions,
  .card.selected .card-actions { opacity: 1; }
  .sel-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--text); color: #fff;
    font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .del-btn {
    width: 26px; height: 26px; background: transparent; border: none;
    border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 15px;
    display: flex; align-items: center; justify-content: center; transition: all 0.12s;
  }
  .del-btn:hover { background: rgba(220,38,38,0.08); color: var(--red); }

  /* ── Select Bar */
  .select-bar {
    position: fixed; bottom: 76px; left: 50%;
    transform: translateX(-50%);
    background: var(--text); border-radius: 12px;
    padding: 8px 8px 8px 14px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    z-index: 50; white-space: nowrap;
    animation: slideUp 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .select-bar.hidden { display: none; }
  .sel-label { font-size: 13px; color: rgba(255,255,255,0.6); }
  .bar-btn {
    padding: 6px 12px; border-radius: 8px; border: none;
    font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.12s;
  }
  .bar-btn.merge { background: #fff; color: var(--text); }
  .bar-btn.merge:hover { opacity: 0.88; }
  .bar-btn.cancel { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }
  .bar-btn.cancel:hover { background: rgba(255,255,255,0.2); }

  /* ── Input Area */
  .input-area {
    position: fixed; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 680px;
    padding: 12px 16px 20px;
    background: linear-gradient(transparent, #fff 36%);
  }
  .input-box {
    display: flex; align-items: flex-end; gap: 8px;
    background: #fff; border: 1px solid var(--border2);
    border-radius: 12px; padding: 10px 10px 10px 14px;
    transition: border-color 0.15s;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07), 0 0 0 1px var(--border);
  }
  .input-box:focus-within { border-color: rgba(0,0,0,0.22); box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
  .paste-area {
    flex: 1; border: none; background: transparent;
    color: var(--text); font-family: var(--font); font-size: 14px;
    resize: none; outline: none; line-height: 1.5;
    min-height: 22px; max-height: 120px; overflow-y: auto;
  }
  .paste-area::placeholder { color: var(--muted); }
  .send-btn {
    width: 32px; height: 32px; flex-shrink: 0;
    background: var(--text); color: #fff; border: none; border-radius: 8px;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; opacity: 0.25;
  }
  .send-btn.ready { opacity: 1; }
  .send-btn.ready:hover { opacity: 0.8; transform: scale(0.96); }

  /* ── Toast */
  #toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%);
    background: var(--text); color: #fff;
    border-radius: 8px; padding: 8px 14px;
    font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    pointer-events: none; white-space: nowrap; z-index: 200;
    opacity: 0; transition: opacity 0.18s;
  }
  #toast.show { opacity: 1; }

  /* ── Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    z-index: 200; display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #fff; border: 1px solid var(--border);
    border-radius: 20px 20px 0 0; padding: 20px;
    width: 100%; max-width: 680px;
    max-height: 85dvh; overflow-y: auto;
    animation: sheetUp 0.22s cubic-bezier(0.34,1.2,0.64,1);
    box-shadow: 0 -4px 40px rgba(0,0,0,0.1);
  }
  @media (min-width: 600px) {
    .modal-overlay { align-items: center; padding: 20px; }
    .modal { border-radius: 16px; max-width: 440px; }
  }
  @keyframes sheetUp {
    from { transform: translateY(16px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .modal-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--border2); margin: 0 auto 16px;
  }
  .modal-title {
    font-size: 15px; font-weight: 600; color: var(--text);
    margin-bottom: 16px; letter-spacing: -0.02em;
  }
  .modal-section { margin-bottom: 20px; }
  .modal-label {
    font-size: 11px; font-weight: 500; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px;
  }
  .modal-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--font);
    font-size: 14px; padding: 9px 12px; outline: none; transition: border-color 0.15s;
  }
  .modal-input:focus { border-color: var(--border2); background: #fff; }
  .modal-btn {
    padding: 7px 14px; border-radius: 8px;
    font-family: var(--font); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
  }
  .modal-btn.primary { background: var(--text); color: #fff; border: none; }
  .modal-btn.primary:hover { opacity: 0.82; }
  .modal-btn.ghost {
    background: transparent; color: var(--muted2);
    border: 1px solid var(--border);
  }
  .modal-btn.ghost:hover { color: var(--text); border-color: var(--border2); }
  .modal-btn.danger { background: transparent; color: var(--red); border: 1px solid rgba(220,38,38,0.2); }
  .modal-btn.danger:hover { background: rgba(220,38,38,0.05); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .tab-item-row {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .tab-item-row:last-child { border-bottom: none; }
  .tab-item-name { flex: 1; font-size: 14px; color: var(--text); font-family: var(--mono); }
  .mini-btn {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted2); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.12s;
  }
  .mini-btn:hover { color: var(--text); border-color: var(--border2); }
  .mini-btn:disabled { opacity: 0.25; cursor: default; }
  .mini-btn.del:hover { color: var(--red); border-color: rgba(220,38,38,0.25); }
  .add-tab-row { display: flex; gap: 8px; margin-top: 10px; }
  .info-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    font-size: 12px; color: var(--muted2); line-height: 1.7;
  }
  .info-box a { color: var(--muted2); }

  /* ── Confirm */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.25);
    z-index: 300; display: flex; align-items: center; justify-content: center;
    padding: 20px; animation: fadeIn 0.12s ease;
  }
  .confirm-box {
    background: #fff; border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; max-width: 320px; width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    animation: sheetUp 0.18s cubic-bezier(0.34,1.2,0.64,1);
  }
  .confirm-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .confirm-msg { font-size: 13px; color: var(--muted2); margin-bottom: 18px; line-height: 1.6; }
  .confirm-btns { display: flex; gap: 8px; justify-content: flex-end; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="2" width="8" height="4" rx="1.5"/>
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <line x1="9" y1="16" x2="15" y2="16"/>
      </svg>
      Clip
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="設定" onclick="showSettings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="tabs-wrap" id="tabs-row"></div>

  <div class="search-wrap">
    <span class="search-icon">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </span>
    <input class="search-input" id="search" placeholder="検索…" oninput="renderList()">
  </div>

  <div id="list"></div>

  <div class="select-bar hidden" id="select-bar">
    <span class="sel-label" id="sel-label"></span>
    <button class="bar-btn merge" onclick="mergeSelected()">統合コピー</button>
    <button class="bar-btn cancel" onclick="clearSelect()">キャンセル</button>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea class="paste-area" id="paste-area"
        placeholder="ここに貼り付け… (Ctrl+V / ⌘V)" rows="1"
        oninput="onTextareaInput(this)"
        onkeydown="onTextareaKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="submitPaste()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Firebase設定（自分のプロジェクトの値に変更） ──────────────────────────────
const FIREBASE_CONFIG = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT.firebaseapp.com",
  databaseURL:       "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID"
};

const ITEMS_KEY    = 'clip_items_v2';
const SETTINGS_KEY = 'clip_settings_v2';

let items    = [];
let settings = { retentionDays: 30, tabs: ['仕事', 'メモ', 'URL', 'コード'] };
let activeTab = 'すべて';
let selected  = [];
let longTimer = null;

function loadAll() {
  try { items    = JSON.parse(localStorage.getItem(ITEMS_KEY)    || '[]'); } catch { items = []; }
  try { settings = { ...settings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') }; } catch {}
}
function saveItems()    { localStorage.setItem(ITEMS_KEY,    JSON.stringify(items)); }
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

const now  = () => Date.now();
const uid  = () => crypto.randomUUID?.() ?? Math.random().toString(36).slice(2);
const esc  = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const trunc = (t, n=200) => t.length > n ? t.slice(0,n)+'…' : t;

function fmtDate(ms) {
  const d = Math.floor((now()-ms)/86400000);
  if (d===0) return new Date(ms).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  if (d===1) return '昨日';
  if (d<7)   return d+'日前';
  return new Date(ms).toLocaleDateString('ja-JP',{month:'short',day:'numeric'});
}

function pruneExpired() {
  const cut = now() - settings.retentionDays * 86400000;
  const before = items.length;
  items = items.filter(i => i.lastUsed >= cut);
  if (items.length < before) saveItems();
}

function addItem(text, tab) {
  const t = text.trim(); if (!t) return;
  const ex = items.find(i => i.text === t);
  if (ex) { ex.copies++; ex.lastUsed = now(); }
  else items.unshift({ id:uid(), text:t, tab:tab||settings.tabs[0]||'未分類', copies:1, createdAt:now(), lastUsed:now() });
  saveItems(); renderList(); toast('追加しました');
}

function copyItem(id) {
  const item = items.find(i => i.id===id); if (!item) return;
  navigator.clipboard.writeText(item.text).then(() => {
    item.copies++; item.lastUsed = now();
    saveItems(); renderList(); toast('コピーしました');
  });
}

function deleteItem(id) {
  const item = items.find(i => i.id===id); if (!item) return;
  confirm2('削除の確認', `"${item.text.slice(0,40)}${item.text.length>40?'…':''}" を削除しますか？`, () => {
    items = items.filter(i => i.id!==id);
    selected = selected.filter(s => s!==id);
    saveItems(); renderList(); updateSelectBar(); toast('削除しました');
  });
}

function changeTab(id) {
  showSheet('タブを変更', settings.tabs.map(t =>
    `<button class="modal-btn ghost" style="width:100%;text-align:left;margin-bottom:6px;font-family:var(--mono)"
      onclick="doChangeTab('${id}','${esc(t)}');closeModal()">${esc(t)}</button>`
  ).join(''));
}
function doChangeTab(id, tab) {
  const item = items.find(i => i.id===id); if (!item) return;
  item.tab = tab; saveItems(); renderList(); toast(`「${tab}」に移動しました`);
}

function toggleSelect(id) {
  if (selected.includes(id)) selected = selected.filter(s=>s!==id); else selected.push(id);
  updateSelectBar(); renderList();
}
function clearSelect() { selected = []; updateSelectBar(); renderList(); }
function updateSelectBar() {
  const bar = document.getElementById('select-bar');
  const lbl = document.getElementById('sel-label');
  if (selected.length===0) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  lbl.textContent = `${selected.length}件選択中`;
}
function mergeSelected() {
  const merged = selected.map(id=>(items.find(i=>i.id===id)||{}).text||'').join('\n');
  navigator.clipboard.writeText(merged).then(() => {
    toast(`${selected.length}件を統合してコピー`); clearSelect();
  });
}

function onTextareaInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120)+'px';
  const btn = document.getElementById('send-btn');
  btn.disabled = !el.value.trim();
  btn.classList.toggle('ready', !!el.value.trim());
}
function onTextareaKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); submitPaste(); }
}
function submitPaste() {
  const el = document.getElementById('paste-area');
  const text = el.value.trim(); if (!text) return;
  if (settings.tabs.length<=1) {
    addItem(text, settings.tabs[0]||'未分類');
    el.value=''; onTextareaInput(el); return;
  }
  showSheet('タブを選択して保存', settings.tabs.map(t =>
    `<button class="modal-btn ghost" style="width:100%;text-align:left;margin-bottom:6px;font-family:var(--mono)"
      onclick="addItem(${JSON.stringify(text)},${JSON.stringify(t)});closeModal()">${esc(t)}</button>`
  ).join(''));
  el.value=''; onTextareaInput(el);
}

function renderTabs() {
  document.getElementById('tabs-row').innerHTML =
    ['すべて',...settings.tabs].map(t =>
      `<button class="tab-btn ${t===activeTab?'active':''}" onclick="switchTab('${esc(t)}')">${esc(t)}</button>`
    ).join('');
}
function switchTab(t) { activeTab=t; renderTabs(); renderList(); }

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const display = items
    .filter(i => activeTab==='すべて' || i.tab===activeTab)
    .filter(i => !q || i.text.toLowerCase().includes(q))
    .sort((a,b) => b.copies-a.copies || b.lastUsed-a.lastUsed);

  const list = document.getElementById('list');
  if (display.length===0) {
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="8" y="2" width="8" height="4" rx="1.5"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/>
        </svg>
      </div>
      <p class="empty-title">クリップはありません</p>
      <p class="empty-sub">下の入力欄にテキストを貼り付けて追加</p>
    </div>`;
    return;
  }
  list.innerHTML = display.map(item => {
    const isSel = selected.includes(item.id);
    const selIdx = selected.indexOf(item.id);
    return `<div class="card ${isSel?'selected':''}" id="c-${item.id}">
      <div class="card-body">
        <div class="card-text">${esc(trunc(item.text))}</div>
        <div class="card-meta">
          <span class="tab-badge" onclick="event.stopPropagation();changeTab('${item.id}')">${esc(item.tab)}</span>
          <span class="meta-date">${fmtDate(item.lastUsed)}</span>
          <span class="meta-copies">×${item.copies}</span>
        </div>
      </div>
      <div class="card-actions">
        ${isSel
          ? `<div class="sel-num">${selIdx+1}</div>`
          : `<button class="del-btn" onclick="event.stopPropagation();deleteItem('${item.id}')" title="削除">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg></button>`
        }
      </div>
    </div>`;
  }).join('');

  display.forEach(item => {
    const card = document.getElementById('c-'+item.id); if (!card) return;
    card.addEventListener('pointerdown', () => { longTimer = setTimeout(()=>toggleSelect(item.id), 500); });
    card.addEventListener('pointerup',    () => clearTimeout(longTimer));
    card.addEventListener('pointerleave', () => clearTimeout(longTimer));
    card.addEventListener('click', () => { if(selected.length>0) toggleSelect(item.id); else copyItem(item.id); });
  });
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

function showSheet(title, bodyHtml) {
  closeModal();
  const ov = document.createElement('div');
  ov.className='modal-overlay'; ov.id='modal-overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-handle"></div>
    <p class="modal-title">${title}</p>
    <div>${bodyHtml}</div>
    <div class="modal-footer"><button class="modal-btn ghost" onclick="closeModal()">キャンセル</button></div>
  </div>`;
  ov.addEventListener('click', e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() { document.getElementById('modal-overlay')?.remove(); }

function confirm2(title, msg, onOk) {
  closeConfirm();
  const ov = document.createElement('div');
  ov.className='confirm-overlay'; ov.id='confirm-overlay';
  ov.innerHTML = `<div class="confirm-box">
    <p class="confirm-title">${title}</p>
    <p class="confirm-msg">${esc(msg)}</p>
    <div class="confirm-btns">
      <button class="modal-btn ghost" onclick="closeConfirm()">キャンセル</button>
      <button class="modal-btn danger" id="confirm-ok">削除</button>
    </div>
  </div>`;
  ov.querySelector('#confirm-ok').addEventListener('click',()=>{ closeConfirm(); onOk(); });
  document.body.appendChild(ov);
}
function closeConfirm() { document.getElementById('confirm-overlay')?.remove(); }

function showSettings() {
  const tabs = settings.tabs;
  const tabListHtml = tabs.map((t,i) => `
    <div class="tab-item-row">
      <span class="tab-item-name">${esc(t)}</span>
      <button class="mini-btn" ${i===0?'disabled':''} onclick="moveTab(${i},-1)">↑</button>
      <button class="mini-btn" ${i===tabs.length-1?'disabled':''} onclick="moveTab(${i},1)">↓</button>
      <button class="mini-btn del" onclick="removeTab(${i})">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>`).join('');

  const html = `
    <div class="modal-section">
      <p class="modal-label">自動消去</p>
      <div style="display:flex;align-items:center;gap:10px">
        <input class="modal-input" type="number" id="ret-days" min="1" max="365"
          value="${settings.retentionDays}" style="width:80px;text-align:center">
        <span style="color:var(--muted);font-size:13px">日間未使用で自動削除</span>
      </div>
    </div>
    <div class="modal-section">
      <p class="modal-label">タブ管理</p>
      <div id="tab-list">${tabListHtml}</div>
      <div class="add-tab-row">
        <input class="modal-input" id="new-tab" placeholder="新しいタブ名…" style="flex:1"
          onkeydown="if(event.key==='Enter')addTabFromInput()">
        <button class="modal-btn primary" onclick="addTabFromInput()">追加</button>
      </div>
    </div>
    <div class="modal-section">
      <p class="modal-label">マルチデバイス同期（Firebase）</p>
      <div class="info-box">
        <b>同期を有効にするには：</b><br>
        1. <a href="https://console.firebase.google.com" target="_blank">Firebase Console</a> でプロジェクト作成<br>
        2. Realtime Database を有効化<br>
        3. このHTMLファイル冒頭の FIREBASE_CONFIG を書き換えて<br>　 GitHub Pages にアップロード
      </div>
    </div>
    <div class="modal-section">
      <p class="modal-label">データ</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="modal-btn ghost" onclick="exportCSV()">CSVエクスポート</button>
        <button class="modal-btn ghost" onclick="importCSV()">CSVインポート</button>
        <button class="modal-btn danger" onclick="clearAllConfirm()">すべて削除</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn ghost" onclick="closeModal()">閉じる</button>
      <button class="modal-btn primary" onclick="saveSettingsFromModal()">保存</button>
    </div>`;

  closeModal();
  const ov = document.createElement('div');
  ov.className='modal-overlay'; ov.id='modal-overlay';
  ov.innerHTML = `<div class="modal"><div class="modal-handle"></div><p class="modal-title">設定</p>${html}</div>`;
  ov.addEventListener('click', e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
}

function saveSettingsFromModal() {
  const days = parseInt(document.getElementById('ret-days')?.value,10);
  if (!isNaN(days)) settings.retentionDays = Math.max(1,days);
  saveSettings(); closeModal(); toast('設定を保存しました'); renderTabs();
}
function moveTab(idx,dir) {
  const t=settings.tabs, ni=idx+dir;
  if(ni<0||ni>=t.length) return;
  [t[idx],t[ni]]=[t[ni],t[idx]];
  saveSettings(); showSettings();
}
function removeTab(idx) {
  const name=settings.tabs[idx];
  settings.tabs.splice(idx,1);
  if(activeTab===name) activeTab='すべて';
  saveSettings(); showSettings(); renderTabs(); renderList();
}
function addTabFromInput() {
  const el=document.getElementById('new-tab');
  const name=el?.value.trim();
  if(!name||settings.tabs.includes(name)) return;
  settings.tabs.push(name);
  saveSettings(); showSettings(); renderTabs();
}
function clearAllConfirm() {
  confirm2('すべて削除','すべてのクリップを削除します。この操作は元に戻せません。',()=>{
    items=[]; saveItems(); renderList(); closeModal(); toast('削除しました');
  });
}

function exportCSV() {
  let csv='\uFEFFtext,tab,copies,created_at,last_used\n';
  items.forEach(i=>{ csv+=`"${i.text.replace(/"/g,'""')}","${i.tab}",${i.copies},${i.createdAt},${i.lastUsed}\n`; });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`clip_backup_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); toast('エクスポートしました');
}
function importCSV() {
  const input=document.createElement('input');
  input.type='file'; input.accept='.csv,text/csv';
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      let raw=ev.target.result;
      if(raw.startsWith('\uFEFF')) raw=raw.slice(1);
      const records=parseCSVAll(raw);
      const rows=records[0]?.[0]==='text'?records.slice(1):records;
      let added=0, skipped=0;
      rows.forEach(r=>{
        const text=r[0]?.trim(); if(!text) return;
        const tab=r[1]?.trim()||settings.tabs[0]||'未分類';
        if(!items.find(i=>i.text===text)){
          items.push({id:uid(),text,tab,copies:1,createdAt:now(),lastUsed:now()}); added++;
        } else skipped++;
      });
      saveItems(); renderList(); toast(`${added}件追加、${skipped}件スキップ`);
    };
    reader.readAsText(file,'UTF-8');
  };
  input.click();
}
function parseCSVAll(raw) {
  const records=[],rec=[],field=[];
  let inQ=false,i=0;
  const push=()=>{ rec.push(field.splice(0).join('')); };
  while(i<raw.length){
    const c=raw[i];
    if(c==='"'&&!inQ) inQ=true;
    else if(c==='"'&&inQ&&raw[i+1]==='"'){field.push('"');i++;}
    else if(c==='"'&&inQ) inQ=false;
    else if(c===','&&!inQ) push();
    else if(c==='\n'&&!inQ){push();records.push([...rec]);rec.length=0;}
    else if(c==='\r'&&!inQ){}
    else field.push(c);
    i++;
  }
  push(); if(rec.length) records.push([...rec]);
  return records.filter(r=>r.some(f=>f.trim()));
}

loadAll(); pruneExpired(); renderTabs(); renderList();
